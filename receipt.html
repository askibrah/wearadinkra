<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt | Wear Adinkra</title>
    <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{'brand-bg':'#f7f8fb','brand-dark':'#0B132B','brand-sea':'#1C5D99'},fontFamily:{sans:['Avant Garde','AvantGarde','ITC Avant Garde Gothic','Century Gothic','sans-serif'],serif:['Avant Garde','AvantGarde','ITC Avant Garde Gothic','Century Gothic','sans-serif']}}}};</script>
    <style>
        @font-face { font-family: 'Avant Garde'; src: local('ITC Avant Garde Gothic'), local('AvantGarde'), local('Avant Garde'), local('Century Gothic'); font-display: swap; }
        @font-face { font-family: 'AvantGarde'; src: local('ITC Avant Garde Gothic'), local('AvantGarde'), local('Avant Garde'), local('Century Gothic'); font-display: swap; }
        html, body, button, input, select, textarea { font-family: 'Avant Garde', 'AvantGarde', 'ITC Avant Garde Gothic', 'Century Gothic', sans-serif !important; }
        @media print { .no-print { display: none !important; } body { background: #fff !important; } }
    </style>
</head>
<body class="bg-brand-bg py-10 px-4">
    <div class="no-print max-w-2xl mx-auto mb-6 flex justify-between items-center">
        <a href="index.html" class="text-brand-dark underline text-sm">← Back to store</a>
        <div class="flex gap-3">
            <button onclick="window.print()" class="bg-white border border-brand-dark text-brand-dark px-5 py-2.5 text-xs uppercase tracking-wider hover:bg-brand-dark hover:text-white"><i class="fa-solid fa-print mr-2"></i>Print</button>
            <button onclick="downloadReceipt()" class="bg-brand-dark text-white px-5 py-2.5 text-xs uppercase tracking-wider hover:bg-brand-sea"><i class="fa-solid fa-download mr-2"></i>Download Receipt</button>
        </div>
    </div>
    <div class="max-w-2xl mx-auto bg-white border border-gray-300 p-8 sm:p-12">
        <div class="flex justify-between items-start border-b-2 border-brand-dark pb-6">
            <div>
                <img src="assets/wearadinkra-logo.png" class="w-20 h-20" alt="Wear Adinkra">
                <h1 class="font-serif text-3xl text-brand-dark mt-3">Wear Adinkra</h1>
                <p class="text-xs text-gray-500 mt-1">Our heritage lives on…!</p>
            </div>
            <div class="text-right">
                <p class="text-xs uppercase tracking-widest text-gray-500">Receipt</p>
                <p class="font-medium text-brand-dark" id="r-order"></p>
                <p class="text-xs text-gray-500 mt-1" id="r-date"></p>
            </div>
        </div>
        <div class="grid grid-cols-2 gap-6 py-6 border-b border-gray-200">
            <div>
                <p class="text-xs uppercase tracking-widest text-gray-500 mb-1">Billed to</p>
                <p class="text-sm font-medium text-brand-dark" id="r-name"></p>
                <p class="text-sm text-gray-600" id="r-address"></p>
                <p class="text-sm text-gray-600" id="r-contact"></p>
            </div>
            <div class="text-right">
                <p class="text-xs uppercase tracking-widest text-gray-500 mb-1">Payment</p>
                <p class="text-sm font-medium text-brand-dark" id="r-method"></p>
                <p class="text-sm text-green-700 mt-1">Paid in full</p>
            </div>
        </div>
        <table class="w-full text-left mt-6">
            <thead><tr class="border-b border-gray-300 text-xs uppercase tracking-wider text-gray-500"><th class="py-2">Item</th><th class="py-2 text-center">Qty</th><th class="py-2 text-right">Amount</th></tr></thead>
            <tbody id="r-items"></tbody>
        </table>
        <div class="flex justify-end mt-6 pt-4 border-t-2 border-brand-dark">
            <div class="w-full max-w-xs">
                <div class="flex justify-between text-sm text-gray-600"><span>Subtotal</span><span id="r-subtotal"></span></div>
                <div class="flex justify-between text-lg font-bold text-brand-dark mt-3 pt-3 border-t border-gray-200"><span>Total</span><span id="r-total"></span></div>
            </div>
        </div>
        <p class="text-center text-xs text-gray-500 mt-10 border-t border-gray-200 pt-6">Thank you for wearing Adinkra. Made with love in Accra, Ghana.</p>
        <div class="no-print flex justify-end mt-4"><button onclick="window.print()" class="bg-white border border-brand-dark text-brand-dark px-5 py-2.5 text-xs uppercase tracking-wider hover:bg-brand-dark hover:text-white"><i class="fa-solid fa-print mr-2"></i>Print</button></div>
    </div>
<script src="assets/js/receipt-image.js"></script>
<script>
function downloadReceipt(){
    const id=(document.getElementById('r-order').textContent||'receipt').trim();
    if (typeof window.downloadReceiptImage === 'function') { window.downloadReceiptImage(id); return; }
    const safe=id.replace(/[^A-Za-z0-9-]/g,'');
    const html='<!DOCTYPE html><html><head><meta charset="utf-8"><title>Receipt '+safe+'</title><script src="https://cdn.tailwindcss.com"><\/script></head><body class="bg-gray-100 p-8">'+document.querySelector('.max-w-2xl').outerHTML+'</body></html>';
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='Wear-Adinkra-Receipt-'+safe+'.html';a.click();URL.revokeObjectURL(a.href);
}
(function () {
    const id = new URLSearchParams(location.search).get('order');
    const orders = JSON.parse(localStorage.getItem('wa_orders') || '[]');
    const order = orders.find(o => o.id === id) || orders[0];
    if (!order) { document.body.innerHTML = '<p class="text-center mt-20">Receipt not found.</p>'; return; }
    const money = n => 'GH₵ ' + Number(n).toFixed(2);
    document.getElementById('r-order').textContent = order.id;
    document.getElementById('r-date').textContent = order.date;
    const c = order.customer || {};
    document.getElementById('r-name').textContent = c.name || 'Valued Customer';
    document.getElementById('r-address').textContent = c.address || '';
    document.getElementById('r-contact').textContent = [c.email, c.phone].filter(Boolean).join(' · ');
    document.getElementById('r-method').textContent = (order.method || '').toUpperCase();
    document.getElementById('r-items').innerHTML = (order.items || []).map(i =>
        '<tr class="border-b border-gray-100"><td class="py-3 text-sm text-brand-dark">' + i.name + '</td><td class="py-3 text-center text-sm">' + i.quantity + '</td><td class="py-3 text-right text-sm">' + money(i.price * i.quantity) + '</td></tr>'
    ).join('');
    document.getElementById('r-subtotal').textContent = money(order.total);
    document.getElementById('r-total').textContent = money(order.total);
})();
</script>
</body>
</html>
