<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate Account | Wear Adinkra</title>
    <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face { font-family: 'Avant Garde'; src: local('ITC Avant Garde Gothic'), local('AvantGarde'), local('Avant Garde'), local('Century Gothic'); font-display: swap; }
        @font-face { font-family: 'AvantGarde'; src: local('ITC Avant Garde Gothic'), local('AvantGarde'), local('Avant Garde'), local('Century Gothic'); font-display: swap; }
        html, body, button, input, select, textarea { font-family: 'Avant Garde', 'AvantGarde', 'ITC Avant Garde Gothic', 'Century Gothic', sans-serif !important; }

        body { font-family: 'Avant Garde', 'AvantGarde', 'ITC Avant Garde Gothic', 'Century Gothic', sans-serif; }
        @keyframes pulseLogo { 0%,100% { transform: scale(.95); } 50% { transform: scale(1.05); } }
        .pulse { animation: pulseLogo 1.3s ease-in-out infinite; }
    </style>
</head>
<body class="bg-brand-bg min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-white border border-gray-200 p-8 text-center">
        <img src="assets/wearadinkra-logo.png" class="w-24 h-24 mx-auto mb-6" alt="Wear Adinkra">
        <h1 class="text-2xl font-bold text-brand-dark mb-3">Account Activation</h1>
        <div id="status" class="text-sm text-gray-600">
            <div class="pulse inline-block w-8 h-8 rounded-full border-4 border-brand-sea border-t-transparent"></div>
            <p class="mt-4">Activating your account…</p>
        </div>
        <a id="home-link" href="index.html" class="hidden mt-6 inline-block bg-brand-dark text-white px-6 py-3 text-xs uppercase tracking-widest hover:bg-brand-sea transition-colors">Continue to Wear Adinkra</a>
        <a id="login-link" href="index.html?login=1" class="hidden mt-3 w-full block bg-brand-dark text-white px-6 py-3 text-xs uppercase tracking-widest hover:bg-brand-sea transition-colors">Log in to your account →</a>
        <a id="back-link" href="index.html?login=1" class="hidden mt-6 inline-block text-xs text-brand-sea underline hover:text-brand-dark">Back to sign in</a>
    </div>

<script>
async function api(action, data = {}) {
    const csrf = await fetch('api/auth.php?action=csrf').then(r => r.json());
    const res = await fetch('api/auth.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, csrf_token: csrf.csrf_token, ...data })
    });
    return res.json();
}
(async function () {
    const status = document.getElementById('status');
    const token = new URLSearchParams(location.search).get('token');
    if (!token) {
        status.innerHTML = '<p class="text-red-600">No activation token was provided.</p>';
        document.getElementById('back-link').classList.remove('hidden');
        return;
    }
    try {
        const result = await api('activate', { token });
        status.innerHTML = '<p class="' + (result.ok ? 'text-green-700' : 'text-red-600') + '">' + result.message + '</p>';
        if (result.ok) {
            document.getElementById('login-link').classList.remove('hidden');
        } else {
            document.getElementById('back-link').classList.remove('hidden');
        }
    } catch (e) {
        status.innerHTML = '<p class="text-red-600">Could not reach the activation service.</p>';
        document.getElementById('back-link').classList.remove('hidden');
    }
    document.getElementById('home-link').classList.remove('hidden');
})();
</script>
</body>
</html>
